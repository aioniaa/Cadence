<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>下班倒计时</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <main class="widget" id="widget" aria-label="下班倒计时">
    <span class="drag-handle" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </span>
    <button class="ring" id="ring" type="button" aria-label="打开班表">
      <span class="ring-core" aria-hidden="true"></span>
    </button>
    <div class="copy">
      <p class="label" id="label">距下班</p>
      <p class="time" id="time">--:--:--</p>
      <p class="meta" id="meta">正在读取班表</p>
    </div>
    <button class="close" id="close" type="button" aria-label="隐藏悬浮倒计时">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 5 6 6M11 5l-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </main>
  <script src="widget.js"></script>
</body>
</html>
